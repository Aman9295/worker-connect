<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkerConnect — Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --orange: #FF5C1A;
            --orange-light: #FF7A42;
            --dark: #0D0D0D;
            --dark2: #161616;
            --dark3: #1F1F1F;
            --dark4: #252525;
            --gray: #888;
            --white: #ffffff;
            --green: #2ECC71;
            --blue: #3498db;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--dark);
            color: var(--white);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        nav {
            background: var(--dark2);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .logo {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 20px;
            text-decoration: none;
            color: white;
        }
        .logo span { color: var(--orange); }
        .nav-back {
            color: var(--gray);
            text-decoration: none;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }
        .nav-back:hover { color: white; }
        .chat-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .conv-list {
            width: 320px;
            background: var(--dark2);
            border-right: 1px solid rgba(255,255,255,0.06);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .conv-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .conv-header h2 {
            font-family: 'Syne', sans-serif;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .search-conv {
            width: 100%;
            background: var(--dark3);
            border: 1px solid rgba(255,255,255,0.08);
            color: white;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-family: 'DM Sans', sans-serif;
            outline: none;
        }
        .search-conv::placeholder { color: var(--gray); }
        .search-conv:focus { border-color: var(--orange); }
        .conv-items { flex: 1; overflow-y: auto; }
        .conv-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 20px;
            cursor: pointer;
            transition: background 0.2s;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .conv-item:hover { background: var(--dark3); }
        .conv-item.active { background: rgba(255,92,26,0.08); border-left: 3px solid var(--orange); }
        .conv-avatar {
            width: 46px; height: 46px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--orange), #e63000);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
            position: relative;
        }
        .conv-avatar.company { background: linear-gradient(135deg, #1a73e8, #0d47a1); border-radius: 12px; }
        .online-dot {
            position: absolute;
            bottom: 1px; right: 1px;
            width: 11px; height: 11px;
            background: var(--green);
            border-radius: 50%;
            border: 2px solid var(--dark2);
        }
        .conv-info { flex: 1; overflow: hidden; }
        .conv-name { font-weight: 600; font-size: 14px; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .conv-last { font-size: 12px; color: var(--gray); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .conv-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
        .conv-time { font-size: 11px; color: var(--gray); }
        .conv-unread {
            background: var(--orange);
            color: white;
            font-size: 10px;
            font-weight: 700;
            width: 18px; height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chat-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .chat-header {
            background: var(--dark2);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
        }
        .chat-header-avatar {
            width: 42px; height: 42px;
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            border-radius: 12px;
        }
        .chat-header-info { flex: 1; }
        .chat-header-name { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 16px; }
        .chat-header-status {
            font-size: 12px;
            color: var(--green);
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 2px;
        }
        .chat-header-status::before {
            content: '';
            width: 6px; height: 6px;
            background: currentColor;
            border-radius: 50%;
        }
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .msg-row { display: flex; align-items: flex-end; gap: 10px; }
        .msg-row.sent { flex-direction: row-reverse; }
        .msg-avatar {
            width: 30px; height: 30px;
            border-radius: 8px;
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }
        .msg-avatar.sent-av { background: linear-gradient(135deg, var(--orange), #e63000); }
        .msg-bubble {
            max-width: 65%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
        }
        .msg-row.received .msg-bubble {
            background: var(--dark3);
            border: 1px solid rgba(255,255,255,0.07);
            border-bottom-left-radius: 4px;
        }
        .msg-row.sent .msg-bubble {
            background: var(--orange);
            border-bottom-right-radius: 4px;
        }
        .msg-wrap { display: flex; flex-direction: column; }
        .msg-time { font-size: 11px; color: var(--gray); margin-top: 4px; padding: 0 4px; }
        .msg-row.sent .msg-time { text-align: right; }
        .date-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 8px 0;
        }
        .date-divider::before, .date-divider::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.07); }
        .date-divider span { font-size: 11px; color: var(--gray); padding: 4px 12px; border-radius: 100px; border: 1px solid rgba(255,255,255,0.07); }
        .typing-indicator { display: none; align-items: center; gap: 10px; padding: 0 24px 8px; }
        .typing-indicator.show { display: flex; }
        .typing-dots { background: var(--dark3); border: 1px solid rgba(255,255,255,0.07); padding: 10px 16px; border-radius: 16px; display: flex; gap: 4px; align-items: center; }
        .typing-dots span { width: 6px; height: 6px; background: var(--gray); border-radius: 50%; animation: typing 1.2s infinite; }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing { 0%, 100% { transform: translateY(0); opacity: 0.4; } 50% { transform: translateY(-4px); opacity: 1; } }
        .input-area {
            background: var(--dark2);
            border-top: 1px solid rgba(255,255,255,0.06);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        .msg-input {
            flex: 1;
            background: var(--dark3);
            border: 1px solid rgba(255,255,255,0.08);
            color: white;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-family: 'DM Sans', sans-serif;
            outline: none;
            transition: border-color 0.2s;
            resize: none;
            max-height: 120px;
        }
        .msg-input:focus { border-color: var(--orange); }
        .msg-input::placeholder { color: var(--gray); }
        .send-btn {
            background: var(--orange);
            color: white;
            border: none;
            width: 46px; height: 46px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.2s;
        }
        .send-btn:hover { background: var(--orange-light); transform: scale(1.05); }
        .empty-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--gray);
            gap: 12px;
        }
        .empty-chat .emoji { font-size: 48px; }
        .empty-chat h3 { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 700; color: white; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

        .no-convs {
            text-align: center;
            padding: 40px 20px;
            color: var(--gray);
            font-size: 14px;
        }
        @media (max-width: 768px) {
    .chat-layout {
        position: relative;
        height: calc(100vh - 57px);
    }
    .conv-list {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        z-index: 5;
        background: var(--dark2);
    }
    .chat-area {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        z-index: 10;
        display: none;
        background: var(--dark);
    }
    .chat-area.mobile-show {
        display: flex;
    }
    .nav-back {
        display: none;
    }
    .mobile-back {
        display: flex !important;
    }
}
    </style>
</head>
<body>

<nav>
    <a href="index.html" class="logo">Worker<span>Connect</span></a>
    <button class="mobile-back" onclick="document.getElementById('chatArea').classList.remove('mobile-show')" 
    style="display:none;background:none;border:none;color:var(--gray);font-size:13px;cursor:pointer;align-items:center;gap:6px;">
        ← Wapas
    </button>
    <a id="backLink" href="worker-dashboard.html" class="nav-back">← Dashboard pe wapas jao</a>
</nav>

<div class="chat-layout">
    <!-- CONVERSATIONS -->
    <div class="conv-list">
        <div class="conv-header">
            <h2>💬 Messages</h2>
            <input class="search-conv" type="text" placeholder="🔍 Dhundo...">
        </div>
        <div class="conv-items" id="convList">
            <div class="no-convs">⏳ Conversations load ho rahi hain...</div>
        </div>
    </div>

    <!-- CHAT AREA -->
    <div class="chat-area" id="chatArea">
        <div class="empty-chat">
            <div class="emoji">💬</div>
            <h3>Koi conversation select karo</h3>
            <p>Left side se kisi ke saath baat shuru karo</p>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, doc, getDoc, setDoc, query,
             orderBy, onSnapshot, serverTimestamp, getDocs }
        from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCs6B68WlvjqorMNbIwhnZ6PdKpakz5_Nc",
        authDomain: "worker-connect-7ac52.firebaseapp.com",
        projectId: "worker-connect-7ac52",
        storageBucket: "worker-connect-7ac52.firebasestorage.app",
        messagingSenderId: "911164379856",
        appId: "1:911164379856:web:ce77e4f8e91232892604d5"
    };

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    let currentUser = null;
    let currentUserData = null;
    let activeChatId = null;
    let unsubMessages = null;

    onAuthStateChanged(auth, async (user) => {
        if (!user) { window.location.href = 'login.html'; return; }
        currentUser = user;

        // User data lo
        const userDoc = await getDoc(doc(db, 'users', user.uid));
        currentUserData = userDoc.data();

        // Dashboard link set karo
        const isCompany = currentUserData?.type === 'company';
        document.getElementById('backLink').href = isCompany
            ? 'company-dashboard.html'
            : 'worker-dashboard.html';

        // Conversations load karo
        loadConversations();
    });

    // Conversations load karo
    async function loadConversations() {
        const convList = document.getElementById('convList');
        convList.innerHTML = '';

        // Saare users lo
        const usersSnap = await getDocs(collection(db, 'users'));
        let found = false;

        usersSnap.forEach(userDoc => {
            const userData = userDoc.data();
            const uid = userDoc.id;

            // Apne aap ko skip karo
            if (uid === currentUser.uid) return;

            found = true;
            const chatId = getChatId(currentUser.uid, uid);
            const isCompany = userData.type === 'company';

            const item = document.createElement('div');
            item.className = 'conv-item';
            item.innerHTML = `
                <div class="conv-avatar ${isCompany ? 'company' : ''}">
                    ${isCompany ? '🏢' : '👷'}
                </div>
                <div class="conv-info">
                    <div class="conv-name">${userData.name || 'User'}</div>
                    <div class="conv-last">${userData.skill || userData.company || userData.type || ''}</div>
                </div>
                <div class="conv-meta">
                    <div class="conv-time">${isCompany ? 'Company' : 'Worker'}</div>
                </div>`;

            item.onclick = () => openChat(chatId, userData, uid, item);
            convList.appendChild(item);
        });

        if (!found) {
            convList.innerHTML = '<div class="no-convs">😔 Abhi koi user nahi hai.<br>Doosra account register karo!</div>';
        }
    }

    // Chat open karo
    function openChat(chatId, otherUser, otherUid, item) {
        activeChatId = chatId;

        // Mobile pe chat area dikhao
        document.getElementById('chatArea').classList.add('mobile-show');

        // Active highlight
        document.querySelectorAll('.conv-item').forEach(i => i.classList.remove('active'));
        item.classList.add('active');

        const isCompany = otherUser.type === 'company';

        // Chat area render karo
        document.getElementById('chatArea').innerHTML = `
            <div class="chat-header">
                <div class="chat-header-avatar">${isCompany ? '🏢' : '👷'}</div>
                <div class="chat-header-info">
                    <div class="chat-header-name">${otherUser.name || 'User'}</div>
                    <div class="chat-header-status">Online</div>
                </div>
            </div>
            <div class="messages-area" id="messagesArea">
                <div class="date-divider"><span>Aaj</span></div>
            </div>
            <div class="typing-indicator" id="typingIndicator">
                <div class="msg-avatar">💬</div>
                <div class="typing-dots"><span></span><span></span><span></span></div>
            </div>
            <div class="input-area">
                <textarea class="msg-input" id="msgInput" placeholder="Message likhо..." rows="1"
                    onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
                <button class="send-btn" onclick="sendMsg()">➤</button>
            </div>`;

        // Messages listen karo
        if (unsubMessages) unsubMessages();
        const q = query(
            collection(db, 'chats', chatId, 'messages'),
            orderBy('timestamp', 'asc')
        );
        unsubMessages = onSnapshot(q, (snap) => {
    snap.docChanges().forEach(change => {
        if (change.type === 'added') {
            const msg = change.doc.data();
            const isSent = msg.senderId === currentUser.uid;
            const time = msg.time || getCurrentTime();
            addMsgToUI(msg.text, isSent, time);
        }
    });
});
    }

    // Message UI mein add karo
    function addMsgToUI(text, isSent, time) {
        const area = document.getElementById('messagesArea');
        if (!area) return;
        const div = document.createElement('div');
        div.className = `msg-row ${isSent ? 'sent' : 'received'}`;
        div.innerHTML = `
            <div class="msg-avatar ${isSent ? 'sent-av' : ''}">${isSent ? '👤' : '👤'}</div>
            <div class="msg-wrap">
                <div class="msg-bubble">${text}</div>
                <div class="msg-time">${time || ''}</div>
            </div>`;
        area.appendChild(div);
        area.scrollTop = area.scrollHeight;
    }

    // Chat ID banana — dono UIDs se
    function getChatId(uid1, uid2) {
        return [uid1, uid2].sort().join('_');
    }

    // Message send karo
    window.sendMsg = async function() {
        const input = document.getElementById('msgInput');
        const text  = input?.value.trim();
        if (!text || !activeChatId) return;

        const now  = new Date();
        const time = now.getHours() + ':' + String(now.getMinutes()).padStart(2, '0');

        input.value = '';
        input.style.height = 'auto';

        await addDoc(collection(db, 'chats', activeChatId, 'messages'), {
            text,
            senderId  : currentUser.uid,
            senderName: currentUserData?.name || 'User',
            time,
            timestamp : serverTimestamp()
        });
    };

    window.handleKey = function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            window.sendMsg();
        }
    };

    window.autoResize = function(el) {
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    };

    window.getCurrentTime = function() {
        const now = new Date();
        return now.getHours() + ':' + String(now.getMinutes()).padStart(2, '0');
    };
</script>
</body>
</html>
