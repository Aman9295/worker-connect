<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkerConnect — Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --orange: #FF5C1A;
            --orange-light: #FF7A42;
            --dark: #0D0D0D;
            --dark2: #161616;
            --dark3: #1F1F1F;
            --gray: #888;
            --white: #ffffff;
            --green: #2ECC71;
            --red: #e74c3c;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--dark);
            color: var(--white);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        body::before {
            content: '';
            position: fixed;
            top: -200px; left: -200px;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(255,92,26,0.08) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -200px; right: -200px;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(79,110,247,0.08) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        .container {
            width: 100%;
            max-width: 480px;
            animation: fadeUp 0.5s ease both;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .logo {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 22px;
            text-align: center;
            margin-bottom: 32px;
            text-decoration: none;
            color: white;
            display: block;
        }
        .logo span { color: var(--orange); }
        .card {
            background: var(--dark2);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 40px;
        }
        .type-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 28px;
        }
        .type-btn {
            background: var(--dark3);
            border: 1px solid rgba(255,255,255,0.08);
            color: var(--gray);
            padding: 14px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.2s;
            text-align: center;
        }
        .type-btn:hover { border-color: var(--orange); color: white; }
        .type-btn.active {
            background: rgba(255,92,26,0.1);
            border-color: var(--orange);
            color: var(--orange);
        }
        .tabs {
            display: flex;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 28px;
        }
        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            color: var(--gray);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            background: none;
            border-top: none;
            border-left: none;
            border-right: none;
            font-family: 'DM Sans', sans-serif;
        }
        .tab:hover { color: white; }
        .tab.active { color: var(--orange); border-bottom-color: var(--orange); }
        .form-title {
            font-family: 'Syne', sans-serif;
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }
        .form-subtitle { font-size: 14px; color: var(--gray); margin-bottom: 28px; }
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: rgba(255,255,255,0.6);
            margin-bottom: 8px;
        }
        .form-group input, .form-group select {
            width: 100%;
            background: var(--dark3);
            border: 1px solid rgba(255,255,255,0.08);
            color: white;
            padding: 14px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-family: 'DM Sans', sans-serif;
            transition: border-color 0.2s;
            outline: none;
        }
        .form-group input:focus, .form-group select:focus { border-color: var(--orange); }
        .form-group input::placeholder { color: var(--gray); }
        .form-group select option { background: var(--dark2); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .input-wrap { position: relative; }
        .input-wrap input { padding-right: 44px; }
        .eye-btn {
            position: absolute;
            right: 14px; top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--gray);
            cursor: pointer;
            font-size: 16px;
        }
        .eye-btn:hover { color: white; }
        .btn-submit {
            width: 100%;
            background: var(--orange);
            color: white;
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.2s;
            margin-top: 8px;
        }
        .btn-submit:hover {
            background: var(--orange-light);
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(255,92,26,0.3);
        }
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .forgot { text-align: right; margin-top: -10px; margin-bottom: 18px; }
        .forgot a { color: var(--orange); font-size: 13px; text-decoration: none; }
        .success-msg {
            display: none;
            background: rgba(46,204,113,0.1);
            border: 1px solid rgba(46,204,113,0.3);
            color: var(--green);
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 18px;
            text-align: center;
        }
        .error-msg {
            display: none;
            background: rgba(231,76,60,0.1);
            border: 1px solid rgba(231,76,60,0.3);
            color: var(--red);
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 18px;
            text-align: center;
        }
        .panel { display: none; }
        .panel.active { display: block; }
        .back-link {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--gray);
            text-decoration: none;
            font-size: 13px;
            margin-bottom: 24px;
            transition: color 0.2s;
        }
        .back-link:hover { color: white; }
        .bottom-link {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: var(--gray);
        }
        .bottom-link a { color: var(--orange); text-decoration: none; font-weight: 500; }
        .loading { display: inline-block; animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @media (max-width: 500px) {
            .card { padding: 28px 20px; }
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<!-- Firebase SDK -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, 
             sendPasswordResetEmail, GoogleAuthProvider, signInWithPopup }
        from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc }
        from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCs6B68WlvjqorMNbIwhnZ6PdKpakz5_Nc",
        authDomain: "worker-connect-7ac52.firebaseapp.com",
        projectId: "worker-connect-7ac52",
        storageBucket: "worker-connect-7ac52.firebasestorage.app",
        messagingSenderId: "911164379856",
        appId: "1:911164379856:web:ce77e4f8e91232892604d5"
    };

    const app      = initializeApp(firebaseConfig);
    const auth     = getAuth(app);
    const db       = getFirestore(app);
    const provider = new GoogleAuthProvider();

    // ── LOGIN ──
    window.handleLogin = async function() {
        const email = document.getElementById('loginEmail').value.trim();
        const pass  = document.getElementById('loginPassword').value;

        if (!email || !pass) {
            showMsg('error', '❌ Email aur password dono bharo!');
            return;
        }

        const btn = document.getElementById('loginBtn');
        btn.disabled = true;
        btn.innerHTML = '⏳ Login ho raha hai...';

        try {
            const userCred = await signInWithEmailAndPassword(auth, email, pass);
            const userDoc  = await getDoc(doc(db, 'users', userCred.user.uid));
            const userData = userDoc.data();
            showMsg('success', '✅ Login successful! Redirect ho rahe hain...');
            setTimeout(() => {
                window.location.href = userData?.type === 'company'
                    ? 'company-dashboard.html'
                    : 'worker-dashboard.html';
            }, 1200);
        } catch (err) {
            btn.disabled = false;
            btn.innerHTML = 'Login Karo →';
            const msgs = {
                'auth/user-not-found'    : '❌ Ye email registered nahi hai!',
                'auth/wrong-password'    : '❌ Password galat hai!',
                'auth/invalid-email'     : '❌ Email sahi nahi hai!',
                'auth/invalid-credential': '❌ Email ya password galat hai!',
                'auth/too-many-requests' : '❌ Bahut zyada tries! Thodi der baad try karo.'
            };
            showMsg('error', msgs[err.code] || '❌ Kuch galat hua: ' + err.message);
        }
    };

    // ── REGISTER ──
    window.handleRegister = async function() {
        const type  = window.currentType;
        const pass1 = document.getElementById('regPassword').value;
        const pass2 = document.getElementById('regPassword2').value;
        let email, name;

        if (type === 'worker') {
            const fname = document.getElementById('wFirstName').value.trim();
            const lname = document.getElementById('wLastName').value.trim();
            email = document.getElementById('wEmail').value.trim();
            name  = fname + ' ' + lname;
            if (!fname || !lname || !email) { showMsg('error', '❌ Sab fields bharo!'); return; }
        } else {
            name  = document.getElementById('cCompanyName').value.trim();
            email = document.getElementById('cEmail').value.trim();
            if (!name || !email) { showMsg('error', '❌ Sab fields bharo!'); return; }
        }

        if (pass1.length < 8) { showMsg('error', '❌ Password kam se kam 8 characters!'); return; }
        if (pass1 !== pass2)  { showMsg('error', '❌ Dono passwords match nahi kar rahe!'); return; }

        const btn = document.getElementById('registerBtn');
        btn.disabled = true;
        btn.innerHTML = '⏳ Account ban raha hai...';

        try {
            const userCred = await createUserWithEmailAndPassword(auth, email, pass1);
            await setDoc(doc(db, 'users', userCred.user.uid), {
                name, email, type,
                skill    : type === 'worker'  ? (document.getElementById('wSkill')?.value || '') : '',
                city     : type === 'worker'  ? (document.getElementById('wCity')?.value  || '') : (document.getElementById('cCity')?.value || ''),
                company  : type === 'company' ? name : '',
                createdAt: new Date().toISOString()
            });
            showMsg('success', '✅ Account ban gaya! Redirect ho rahe hain...');
            setTimeout(() => {
                window.location.href = type === 'company'
                    ? 'company-dashboard.html'
                    : 'worker-dashboard.html';
            }, 1200);
        } catch (err) {
            btn.disabled = false;
            btn.innerHTML = 'Account Banao →';
            const msgs = {
                'auth/email-already-in-use': '❌ Ye email pehle se registered hai!',
                'auth/invalid-email'       : '❌ Email sahi nahi hai!',
                'auth/weak-password'       : '❌ Password zyada strong banao!'
            };
            showMsg('error', msgs[err.code] || '❌ Kuch galat hua: ' + err.message);
        }
    };

    // ── GOOGLE LOGIN ──
    window.handleGoogleLogin = async function() {
        const type = window.currentType;
        try {
            const result  = await signInWithPopup(auth, provider);
            const user    = result.user;
            const userDoc = await getDoc(doc(db, 'users', user.uid));

            if (!userDoc.exists()) {
                // Pehli baar Google se login — data save karo
                await setDoc(doc(db, 'users', user.uid), {
                    name     : user.displayName || '',
                    email    : user.email       || '',
                    type     : type,
                    skill    : '',
                    city     : '',
                    company  : type === 'company' ? (user.displayName || '') : '',
                    createdAt: new Date().toISOString()
                });
                showMsg('success', '✅ Google se account ban gaya! Redirect ho rahe hain...');
            } else {
                showMsg('success', '✅ Google se login successful!');
            }

            setTimeout(() => {
                const savedType = userDoc.exists() ? userDoc.data()?.type : type;
                window.location.href = savedType === 'company'
                    ? 'company-dashboard.html'
                    : 'worker-dashboard.html';
            }, 1200);

        } catch (err) {
            const msgs = {
                'auth/popup-closed-by-user'      : '❌ Popup band kar diya! Dobara try karo.',
                'auth/cancelled-popup-request'   : '❌ Request cancel ho gayi!',
                'auth/popup-blocked'             : '❌ Popup block ho gaya! Browser settings check karo.'
            };
            showMsg('error', msgs[err.code] || '❌ Google login fail: ' + err.message);
        }
    };

    // ── FORGOT PASSWORD ──
    window.handleForgotPassword = async function() {
        const email = document.getElementById('loginEmail').value.trim();
        if (!email) { showMsg('error', '❌ Pehle email daalo!'); return; }
        try {
            await sendPasswordResetEmail(auth, email);
            showMsg('success', '✅ Password reset email bhej diya!');
        } catch (err) {
            showMsg('error', '❌ Email nahi mila!');
        }
    };
</script>

</div>

<script>
    window.currentType = 'worker';

    // URL se type detect karo
    const urlParams = new URLSearchParams(window.location.search);
    const typeParam = urlParams.get('type');
    if (typeParam === 'company') {
        setType('company', document.querySelectorAll('.type-btn')[1]);
    }

    function setType(type, btn) {
        window.currentType = type;
        document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('workerFields').style.display  = type === 'worker'  ? 'block' : 'none';
        document.getElementById('companyFields').style.display = type === 'company' ? 'block' : 'none';
        document.getElementById('loginTitle').textContent    = type === 'worker' ? 'Worker Login'    : 'Company Login';
        document.getElementById('registerTitle').textContent = type === 'worker' ? 'Worker Register' : 'Company Register';
    }

    function setTab(tab, btn) {
        document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('loginPanel').classList.toggle('active',    tab === 'login');
        document.getElementById('registerPanel').classList.toggle('active', tab === 'register');
        document.getElementById('successMsg').style.display = 'none';
        document.getElementById('errorMsg').style.display   = 'none';
        const bl = document.getElementById('bottomLink');
        if (tab === 'login') {
            bl.innerHTML = `Account nahi hai? <a href="#" onclick="setTab('register', document.querySelectorAll('.tab')[1]); return false;">Register karo</a>`;
        } else {
            bl.innerHTML = `Pehle se account hai? <a href="#" onclick="setTab('login', document.querySelectorAll('.tab')[0]); return false;">Login karo</a>`;
        }
    }

    function togglePass(id, btn) {
        const input = document.getElementById(id);
        input.type = input.type === 'password' ? 'text' : 'password';
        btn.textContent = input.type === 'password' ? '👁' : '🙈';
    }

    function showMsg(type, text) {
        const el   = document.getElementById(type === 'success' ? 'successMsg' : 'errorMsg');
        const hide = document.getElementById(type === 'success' ? 'errorMsg' : 'successMsg');
        hide.style.display = 'none';
        el.textContent = text;
        el.style.display = 'block';
    }
</script>
</body>
</html>
